<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCFD13 Station Inspections</title><meta name="theme-color" content="#1f3a4d">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f3f1;--card:#fff;--ink:#1b2024;--mut:#5d676e;--line:#d5d9d7;--pri:#1f3a4d;--on:#fff;--bad:#b3261e;--ok:#2e7d4f;--warn:#b45f06;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181b;--card:#1d2328;--ink:#e8ecee;--mut:#9aa6ad;--line:#2f383e;--pri:#7fb0cf;--on:#10202b;--bad:#ff8a80;--ok:#6fcf97;--warn:#f2a65a}}
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:12px 14px 84px}h1{font-size:1.35rem;margin:.6rem 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:.7rem 0}input,textarea,select{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px}
textarea{min-height:64px}button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:1px}
.pri{background:var(--pri);color:var(--on);border-color:var(--pri);width:100%;margin-top:14px;font-weight:600}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;margin:8px 0;padding:16px;border-left:6px solid var(--line);text-align:left}
.card span{font-size:.85rem;color:var(--mut)}.card.ok{border-left-color:var(--ok)}.card.warn{border-left-color:var(--warn)}.card.prog{border-left-color:var(--pri)}
.bar{display:flex;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
.pg{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ok)}.sm{font-size:.85rem;color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:0 12px 12px}summary{padding:14px 0;font-weight:600;cursor:pointer}summary em{float:right;font-weight:400;font-style:normal;color:var(--mut)}
.it{padding:10px 0;border-top:1px solid var(--line)}.it p{margin:0 0 8px}small{display:block;color:var(--mut);margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sg button{padding:9px 0}.sg.two{grid-template-columns:repeat(2,1fr)}.ck{display:flex;gap:8px;color:var(--ink);font-size:.9rem}.ck input{width:auto;margin:3px 0 0}select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
.sg .on.Y{background:var(--ok);border-color:var(--ok);color:#fff}.sg .on.N{background:var(--bad);border-color:var(--bad);color:#fff}.sg .on.NA{background:var(--mut);border-color:var(--mut);color:#fff}
#err{color:var(--bad);font-size:.9rem;margin-top:10px}#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border:0;border-radius:0;background:none;padding:14px 0}#tabs .on{font-weight:700;color:var(--pri);box-shadow:inset 0 3px var(--pri)}
@media print{#tabs,.bar button,.pri,.sg button:not(.on){display:none}.sg{display:block}body{background:#fff;color:#000}details{border-color:#999}}
</style></head><body><div id="app"><main id="main"></main></div>
<nav id="tabs"><button data-t="home">Inspect</button><button data-t="hist">History</button><button data-t="set">Setup</button><button data-t="back">Backup</button></nav>
<script>
const D={"na": {"Station 13-1": ["s4i3", "s7i7", "s10i14"], "Station 13-2": ["s0i1", "s1i7", "s6i6", "s7i6", "s7i7", "s10i6", "s10i8", "s10i12", "s10i13", "s10i14"], "Station 13-3": ["s0i1", "s1i7", "s4i1", "s4i2", "s4i3", "s6i6", "s7i6", "s7i7", "s10i6", "s10i8", "s10i12", "s10i13", "s10i14"], "Station 13-4": ["s0i1", "s1i7", "s4i1", "s4i2", "s4i3", "s5i6", "s6i6", "s7i6", "s7i7", "s8i0", "s8i1", "s10i6", "s10i8", "s10i12", "s10i13", "s10i14"]}, "stations": ["Station 13-1", "Station 13-2", "Station 13-3", "Station 13-4"], "sections": [{"t": "Postings and required plans", "items": [{"x": "OSHA 300A posted in each station by Feb 1, take down Mar 1.", "id": "s0i0", "opt": 1}, {"x": "Pre-incident response plans, including proper actions to take in event of emergency and routes of exiting during emergencies shall be available to all employees for the work location to which they are assigned.", "id": "s0i1"}, {"x": "Inspections of fire stations shall be made at least monthly and records maintained to ensure that stations are reasonably free of recognized hazards. These inspections shall include, but not be limited to, tools, apparatus, extinguishers, protective equipment, and life safety equipment.", "id": "s0i2"}, {"x": "A bulletin board or posting area shall be provided exclusively for safety and health materials and large enough to display the required safety and health posters.", "id": "s0i3"}, {"x": "The Washington Industrial Safety and Health (WISHA) workplace poster shall be displayed in the station as required, where all employees are likely to see it.", "id": "s0i4"}]}, {"t": "Housekeeping and workplace", "items": [{"x": "All areas of the workplace including passageways, storage rooms, service rooms, offices, hallways, and apparatus floors shall be kept clean, orderly and sanitary condition.", "id": "s1i0"}, {"x": "All areas of the workplace are clear of obstructions such as nails, splinters, loose boards and unnecessary holes and openings.", "id": "s1i1"}, {"x": "Floors shall be kept free of debris.", "id": "s1i2"}, {"x": "Shower areas properly protected to prevent slippery floors.", "id": "s1i3"}, {"x": "Waste containers emptied regularly.", "id": "s1i4"}, {"x": "All stations shall maintain a first-aid kit. The location shall be clearly identified and easily retrieved.", "id": "s1i5"}, {"x": "Smoking is prohibited in public places and workplaces within twenty-five feet of entrances, exits, windows that open, and ventilation intakes that serve an enclosed area.", "id": "s1i6"}, {"x": "Cooking appliances are clean and in good working order. Any potentially contaminated ppe is not allowed in kitchen or living areas.", "id": "s1i7"}, {"x": "Asbestos in facilities, buildings, and properties used by fire departments. Fire department employees must be informed of the presence and location of asbestos-containing material (ACM) and presumed-asbestos-containing material (PACM) in areas of buildings where employees work.", "id": "s1i8"}]}, {"t": "Lighting", "items": [{"x": "Adequate lighting is provided in all work areas.", "id": "s2i0"}]}, {"t": "Exits and exit signs", "items": [{"x": "All exits are clearly visible and marked with a distinctive sign reading \"EXIT\".", "id": "s3i0"}, {"x": "EXIT sign lettering is at least 6\" tall and 3/4\" wide.", "id": "s3i1"}, {"x": "EXIT signs are a distinctive color.", "id": "s3i2"}, {"x": "EXIT sign lighting is operational.", "id": "s3i3"}, {"x": "Doorways that may be mistaken for an EXIT are marked as \"Not as EXIT\" or with a sign indicating actual use.", "id": "s3i4"}, {"x": "Exits and signs are free of decorations, draperies, and furnishings, or any other material that may obstruct or conceal EXIT signs in any way.", "id": "s3i5"}, {"x": "EXIT routes are free from obstructions.", "id": "s3i6"}, {"x": "EXIT doors are readily opened from the inside.", "id": "s3i7"}]}, {"t": "Stairways", "items": [{"x": "Firefighters' routes to apparatus are free of projections, tripping hazards, loose objects and other impediments.", "id": "s4i0"}, {"x": "Stairway tread is of a nonskid design.", "id": "s4i1"}, {"x": "Stairways are in good condition with standard railings provided for every flight having four or more risers.", "id": "s4i2"}, {"x": "A standard railing guard for a landing platform includes a toe guard to prevent falls of materials.", "id": "s4i3"}]}, {"t": "Apparatus bay", "items": [{"x": "Station apparatus floors are kept free of oil, grease, water, and tripping hazards.", "id": "s5i0"}, {"x": "Tools and equipment projecting from apparatus or facilities are clearly marked with bright colored flags, stripes, or other identification to warn against collision-type accidents.", "id": "s5i1"}, {"x": "Three feet of clearance shall be maintained around apparatus parked within the station where the station's width permits.", "id": "s5i2"}, {"x": "Floors must have slip resistant surfaces on areas where personnel would normally mount or dismount apparatus.", "id": "s5i3"}, {"x": "Apparatus doors shall be maintained in a safe operating condition.", "id": "s5i4"}, {"x": "Apparatus doors shall have adequate space for proper clearance of vehicles.", "id": "s5i5"}, {"x": "Adequate eye protection shall be used when working with abrasive wheels, grinders, drills, saws, welding equipment, or any other tool likely to present an eye hazard. Is eye protection readily available and in good condition where these activities may occur?", "id": "s5i6"}, {"x": "Abrasive and composite blades must be stored and protected against exposure to fuel and oil.", "id": "s5i7"}, {"x": "Hearing protection is provided to all employees with an appropriate selection of hearing protectors, minimum 2 styles. Hearing protection is required when dBA is equal to or higher than 85.", "id": "s5i8"}, {"x": "All power tools shall be provided with proper guarding for electrical, cutting and moving parts. Power cords shall not be used for hoisting.", "id": "s5i9"}]}, {"t": "Hand and power tools", "items": [{"x": "Hand tools shall be maintained in clean operating condition.", "id": "s6i0"}, {"x": "Hand tools shall be safely stored when not in use. Tools shall be inspected periodically and maintained to ensure safe operating condition.", "id": "s6i1"}, {"x": "Hand tool handles/grips shall not be broken or splintered.", "id": "s6i2"}, {"x": "Defective, worn, and /or missing parts on tools shall be replaced/repaired immediately.", "id": "s6i3"}, {"x": "Pulleys and belts shall be properly guarded.", "id": "s6i4"}, {"x": "Chain drives and sprockets shall be properly guarded.", "id": "s6i5"}, {"x": "Air cleaning nozzles shall not emit more than 30 psi deadened pressure. (OSHA compliant nozzle will cover this.)", "id": "s6i6"}, {"x": "All equipment shall be securely mounted (if mounting required for tool use) on the surface on which it sits.", "id": "s6i7"}, {"x": "Tool rooms shall be kept clean, organized, and free of tripping hazards.", "id": "s6i8"}]}, {"t": "Fire extinguishers and alarms", "items": [{"x": "The correct type portable fire extinguisher shall be provided depending on the type, size, and severity of the fire that could occur.", "id": "s7i0"}, {"x": "Portable fire extinguishers shall be kept fully charged, in operable condition and left in their designated places.", "id": "s7i1"}, {"x": "Portable fire extinguishers shall be visually inspected on a monthly basis - and noted on the tag on the extinguishers.", "id": "s7i2"}, {"x": "All portable fire extinguishers shall be subject to an annual maintenance check. Records of all annual maintenance chaecks shall be maintained for a period of 1 year after the last maintenance check.", "id": "s7i3"}, {"x": "Hydrostatic testing of portable fire extinguishers shall be in compliance.", "id": "s7i4"}, {"x": "Portable fire extinguishers shall have a tag or label securely attached that indicates the month and year recharging was performed and that identifies the person performing the service. A \"Verification of Service\" collar shall be attached to the extinguisher.", "id": "s7i5"}, {"x": "Smoke alarms shall be tested each month in manned stations not equipped with a fire alarm system.", "id": "s7i6"}, {"x": "Sleeping areas shall be protected by smoke alarms and CO detectors.", "id": "s7i7"}]}, {"t": "Hazardous materials and storage", "items": [{"x": "Compressed gas cylinders shall be stored in the method required for that cylinder. Upright cylinders shall be secured to wall and stored away from combustible materials.", "id": "s8i0"}, {"x": "Compressed gas cylinder caps are in place except when in use, being serviced, or filled.", "id": "s8i1"}, {"x": "Flammable and combustible liquids shall be stored in tanks, flammable liquid cabinets, or closed containers.", "id": "s8i2"}, {"x": "Safety containers with self-closing lids or metal lidded containers shall be used for the storage of soiled and oily rags.", "id": "s8i3"}, {"x": "SDS is readily accessible to all MCFD13 members and NIOSH. This is via electronic means in MCFD13 - QR code located on Safety Committee bulletin board in each station.", "id": "s8i4"}, {"x": "All containers of hazardous chemicals in the workplace must be labeled, tagged, or marked with the following information: Identity of hazardous chemical using the chemical or common name; appropriate hazard warnings which give general information about relevant health and physical hazards of the chemicals.", "id": "s8i5"}, {"x": "Worker Right-To-Know information is clearly posted.", "id": "s8i6"}]}, {"t": "Electrical", "items": [{"x": "All electrical equipment shall be inspected for hazards likely to cause employees death or serious harm (power cords, plugs, worn switches, defective ground circuits, or other faults that could render them unsafe for use).", "id": "s9i0"}, {"x": "All electrical equipment is approved or listed by a recognized laboratory such as UL or other approving agency.", "id": "s9i1"}, {"x": "All electrical equipment is approved, or listed as approved, for the purpose being used.", "id": "s9i2"}, {"x": "All electrical equipment has strong and durable guards providing adequate protection including parts designed to enclose and protect other equipment.", "id": "s9i3"}, {"x": "All electrical equipment is insulated.", "id": "s9i4"}, {"x": "All electrical equipment won't overheat under conditions of use.", "id": "s9i5"}, {"x": "All electrical equipment won't produce arcs during normal use.", "id": "s9i6"}, {"x": "All electrical equipment is classified by type, size, voltage, current capacity, specific use, and other factors.", "id": "s9i7"}, {"x": "Electrical switches and circuit breakers shall be marked to show their purpose. Disconnect means is marked to show when open or closed and what equipment it controls. Service, feeder, and branch circuits are marked to show when the circuit is open or closed Markings are durable and appropriate to environment.", "id": "s9i8"}, {"x": "Conduits shall be attached to all supports and tightly connected to junction and outlet boxes.", "id": "s9i9"}, {"x": "Electrical boxes/cabinets have minimum of 30\" clearance for operation or maintenance of equipment.", "id": "s9i10"}, {"x": "All extension cords are of an approved type and in good condition.", "id": "s9i11"}, {"x": "Electrical cords and plug-connected equipment shall be checked for loose parts, deformed or missing pins, external defects and damage, damage to the outer covering or insulation, pinched or crushed covering or insulation that may indicate internal damage, or frayed components.", "id": "s9i12"}, {"x": "Extension cords shall not be used in place of permanent wiring. These devices are temporary only.", "id": "s9i13"}, {"x": "Electrical cords shall not be attached to building surfaces run through doorways, windows, or other openings, or run through walls, ceilings, or floors.", "id": "s9i14"}, {"x": "Portable heaters used in stations shall be placed away from combustibles in compliance with the manufacturer’s instructions and out of travel routes. Portable space heaters will be unplugged from electrical service when supervision is not provided.", "id": "s9i15"}]}, {"t": "General conditions", "items": [{"x": "All work sites are clean and clear of obstructions/tripping hazards.", "id": "s10i0"}, {"x": "All floor surfaces are kept dry or appropriate means are taken to assure the surfaces are slip resistant.", "id": "s10i1"}, {"x": "Apparatus bay floors and shop areas are clean.", "id": "s10i2"}, {"x": "The apparatus bay exhaust system is in use and working properly.", "id": "s10i3"}, {"x": "The station exterior and grounds are clean and free of safety hazards.", "id": "s10i4"}, {"x": "All combustibles are stored properly.", "id": "s10i5"}, {"x": "No combustibles are stored around the furnace or hot water heater.", "id": "s10i6"}, {"x": "All are containers properly labeled.", "id": "s10i7"}, {"x": "The kitchen range hoods are clean.", "id": "s10i8"}, {"x": "All floor drains are clean and draining properly.", "id": "s10i9"}, {"x": "All material safety data sheets are up to date. Select a random chemical from each station and look it up as a test. Go to https://mason13.sds.center for SDS", "id": "s10i10"}, {"x": "Extension cords are not used as permanent wiring.", "id": "s10i11"}, {"x": "Station CO detectors are in place and working.", "id": "s10i12"}, {"x": "General housekeeping conditions. The restrooms, kitchen, meeting rooms, and quarters areas are clean and items are put away.", "id": "s10i13"}, {"x": "The crew quarters clear of obstructions/tripping hazards? The rooms are clean. (When rooms are completed.)", "id": "s10i14"}]}]},KEY="mcfd13_insp_v1",$=s=>document.querySelector(s),all=D.sections.flatMap(s=>s.items),hid=st=>(S.cfg&&S.cfg[st])||D.na[st]||[],its=st=>all.filter(i=>!hid(st).includes(i.id));
let S={name:"",recs:{}};try{const j=localStorage.getItem(KEY);if(j)S=JSON.parse(j)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const d0=new Date();let tab="home",cur=null,op=new Set(),month=d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0");
const rk=(m,st)=>m+"|"+st,mname=m=>new Date(m+"-15T12:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});
const cnt=r=>{const l=its(r.st),a=l.map(i=>r.a[i.id]).filter(Boolean);return{done:a.length,no:a.filter(v=>v==="N").length,tot:l.length}};
const badge=r=>{const k=cnt(r);return r.done?["Complete · "+(k.no?k.no+" need corrective action":"no deficiencies"),k.no?"warn":"ok"]:["In progress "+k.done+"/"+k.tot,"prog"]};
function render(){const m=$("#main");$("#tabs").style.display=cur?"none":"flex";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
if(cur)return inspect(m);
if(tab==="home"){m.innerHTML=`<h1>MCFD13 station inspections</h1><label>Inspector<input id="nm" value="${esc(S.name)}" placeholder="Your name" autocomplete="name"></label><label>Month<input id="mo" type="month" value="${month}"></label>`+D.stations.map(st=>{const r=S.recs[rk(month,st)],b=r?badge(r):["Not started",""];return `<button class="card ${b[1]}" data-st="${st}"><b>${st}</b><span>${b[0]}</span></button>`}).join("");
$("#nm").oninput=e=>{S.name=e.target.value;save()};$("#mo").onchange=e=>{if(e.target.value){month=e.target.value;render()}};
m.querySelectorAll(".card").forEach(c=>c.onclick=()=>{if(!S.name.trim()){$("#nm").focus();return}const k=rk(month,c.dataset.st);if(!S.recs[k]){S.recs[k]={st:c.dataset.st,month,by:S.name.trim(),a:{},n:{},done:null,u:Date.now()};save()}cur=k;render();scrollTo(0,0)})}
else if(tab==="hist"){const rs=Object.entries(S.recs).sort((a,b)=>b[0].localeCompare(a[0]));m.innerHTML="<h1>History</h1>"+(rs.length?rs.map(([k,r])=>{const b=badge(r);return `<button class="card ${b[1]}" data-k="${esc(k)}"><b>${esc(r.st)} · ${mname(r.month)}</b><span>${b[0]}</span></button>`}).join(""):"<p class=sm>No inspections yet. Start one from the Inspect tab.</p>");m.querySelectorAll(".card").forEach(c=>c.onclick=()=>{cur=c.dataset.k;render();scrollTo(0,0)})}
else if(tab==="set")setup(m);else{m.innerHTML=`<h1>Backup</h1><p class=sm>Records are stored on this device. Export a backup regularly, and use it to move records between your phone and laptop.</p><h2>Shared sync</h2>${S.auth?`<p class=sm>Signed in as ${esc(S.auth.email)}.</p><button class=pri id=sbs>Sync now</button><button id=sbo style="width:100%;margin-top:10px">Sign out</button>`:`<p class=sm>Anyone can download the shared records without signing in.</p><button class=pri id=sbd>Download shared records</button><p class=sm style="margin-top:14px">To upload your own inspections, sign in:</p><label>Email<input id=sbe type=email autocomplete=username></label><label>Password<input id=sbp type=password autocomplete=current-password></label><button id=sbs style="width:100%;margin-top:10px">Sign in and sync</button>`}<p id=sbm class=sm></p><h2>Local backup</h2><button class=pri id=ecsv>Export CSV for records</button><button class=pri id=ejs>Export backup (JSON)</button><label>Import backup (JSON)<input id=imp type=file accept=".json,application/json"></label><p id=err></p>`;
if($("#sbd"))$("#sbd").onclick=async()=>{const o=$("#sbm");o.textContent="Downloading…";try{const x=await sync(),m="Downloaded "+x[1]+" record(s).";render();if($("#sbm"))$("#sbm").textContent=m}catch(e){o.textContent=e.message}};
$("#sbs").onclick=async()=>{const o=$("#sbm"),fresh=!S.auth;o.textContent=fresh?"Signing in…":"Syncing…";try{if(fresh)await authCall("password",{email:$("#sbe").value.trim(),password:$("#sbp").value});const x=await sync(),m=S.auth&&!x[2]?"Signed in, but this account can only download. Downloaded "+x[1]+".":"Synced. Uploaded "+x[0]+", downloaded "+x[1]+".";if(tab==="back"&&!cur){render();if($("#sbm"))$("#sbm").textContent=m}}catch(e){if(fresh){S.auth=null;save()}o.textContent=e.message}};
if($("#sbo"))$("#sbo").onclick=()=>{S.auth=null;save();render()};
$("#ecsv").onclick=()=>dl("mcfd13-inspections.csv",csv(),"text/csv");$("#ejs").onclick=()=>dl("mcfd13-backup.json",JSON.stringify({name:S.name,recs:S.recs,cfg:S.cfg}),"application/json");
$("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);Object.assign(S.recs,j.recs||{});if(j.cfg)S.cfg=j.cfg;if(!S.name&&j.name)S.name=j.name;save();$("#err").style.color="var(--ok)";$("#err").textContent="Imported "+Object.keys(j.recs||{}).length+" inspections."}catch(x){$("#err").textContent="That file is not a valid backup."}})}}}
function inspect(m){const r=S.recs[cur],k=cnt(r),ro=!!r.done,y=scrollY,sg={Y:"Yes",N:"No",NA:"N/A"};
m.innerHTML=`<div class=bar><button id=bk>‹ Back</button><b>${esc(r.st)} · ${mname(r.month)}</b></div><div class=pg><i style="width:${k.done/k.tot*100}%"></i></div><p class=sm>${k.done} of ${k.tot} answered · ${k.no} need corrective action · Inspector: ${esc(r.by)}</p>`+
D.sections.map((s0,si)=>{const s={t:s0.t,items:s0.items.filter(i=>!hid(r.st).includes(i.id))};if(!s.items.length)return "";const no=s.items.some(i=>r.a[i.id]==="N"),dn=s.items.filter(i=>r.a[i.id]).length;return `<details data-s=${si} ${op.has(si)?"open":""}><summary>${s.t}<em>${dn}/${s.items.length}</em></summary>`+s.items.map(i=>`<div class=it><p>${esc(i.x)}</p><div class="sg${i.opt?"":" two"}" data-i="${i.id}">${(i.opt?["Y","N","NA"]:["Y","N"]).map(v=>`<button data-v=${v} ${ro?"disabled":""} class="${r.a[i.id]===v?"on "+v:""}">${sg[v]}</button>`).join("")}</div></div>`).join("")+`<label>${no?"Corrective action required: describe the problem and the fix":"Notes (optional)"}<textarea data-n=${si} ${ro?"disabled":""}>${esc(r.n[si]||"")}</textarea></label></details>`}).join("")+
(ro?`<button class=pri id=pr>Print this inspection</button><button class=pri id=ro>Reopen to edit</button>`:`<button class=pri id=sub>Complete inspection</button><div id=err></div>`);
scrollTo(0,y);$("#bk").onclick=()=>{cur=null;render()};
m.querySelectorAll("details").forEach(d=>d.ontoggle=()=>d.open?op.add(+d.dataset.s):op.delete(+d.dataset.s));
m.querySelectorAll(".sg button").forEach(b=>b.onclick=()=>{const i=b.parentNode.dataset.i,v=b.dataset.v;if(r.a[i]===v)delete r.a[i];else r.a[i]=v;r.u=Date.now();save();render()});
